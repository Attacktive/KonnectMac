name: 'Tests'

on:
  pull_request:
  push:
    branches: ['main']

jobs:
  tests:
    name: 'macOS ${{ matrix.version }} tests'
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '15'
            runner: 'macos-15'
          - version: '26'
            runner: 'macos-26'
    runs-on: '${{ matrix.runner }}'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v7.0.1'
      - name: 'Run tests'
        run: |
          xcodebuild -version
          set +e
          xcodebuild -project KonnectMac.xcodeproj -scheme KonnectMac -destination 'platform=macOS' test CODE_SIGNING_ALLOWED=NO > xcodebuild.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -E 'error:|failed|FAIL|Test Case.*failed' xcodebuild.log | tail -100 || tail -100 xcodebuild.log
            exit "$status"
          fi
          tail -40 xcodebuild.log
